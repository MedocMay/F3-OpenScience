[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f3-openscience"
version = "0.2.0"
description = "开源版 Claude Science —— 第一个产出前有独立校验、可署名的科研 Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Junjie Mei (梅俊杰)", email = "maymedoc@gmail.com" }]
dependencies = []                      # 核心零依赖(仅标准库);校验用 urllib

[project.urls]
Homepage      = "https://github.com/MedocMay/F3-OpenScience"
Documentation = "https://github.com/MedocMay/F3-OpenScience/blob/main/README.md"
Repository    = "https://github.com/MedocMay/F3-OpenScience"
Changelog     = "https://github.com/MedocMay/F3-OpenScience/blob/main/CHANGELOG.md"
Author        = "https://frontierfirm.fund"

[project.optional-dependencies]
# 云端多租户:BYOK 密管(必需)+ Postgres / Redis(按部署形态可选)
cloud = ["cryptography>=42", "psycopg[binary]>=3.1", "redis>=5"]
# 化学领域的价键判据(守恒与不饱和度judgement 零依赖即可用)
chem  = ["rdkit>=2024.3"]
# 使用 generated/python 下的 pydantic 类型绑定时
types = ["pydantic>=2"]
test  = ["jsonschema>=4"]
all   = ["cryptography>=42", "psycopg[binary]>=3.1", "redis>=5", "rdkit>=2024.3", "pydantic>=2", "jsonschema>=4"]

[project.scripts]
f3-coe = "coe_kernel.server:main"
f3-mem = "memory.server:main"
f3-global = "memory.global_server:main"
f3-pipeline = "pipeline.server:main"

[tool.hatch.build.targets.wheel]
packages = ["coe_kernel", "memory", "pipeline", "model", "orchestrator", "cloud"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "contracts"
