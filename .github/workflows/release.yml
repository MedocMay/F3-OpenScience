name: Release Installers
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

jobs:
  # 后端:一次构建,全平台通用(纯 Python)
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: opensci-python, path: dist/* }

  # 桌面壳:三平台矩阵,各自产出原生安装包
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # .AppImage / .deb
            deps: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          - os: macos-latest   # .dmg (Apple Silicon)
            deps: ""
          - os: macos-13       # .dmg (Intel)
            deps: ""
          - os: windows-latest # .msi / .exe
            deps: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        if: matrix.deps != ''
        run: ${{ matrix.deps }}
      - name: Install & build shell
        working-directory: apps/shell
        run: npm i && npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: opensci-desktop-${{ matrix.os }}
          path: |
            apps/shell/src-tauri/target/release/bundle/**/*.AppImage
            apps/shell/src-tauri/target/release/bundle/**/*.deb
            apps/shell/src-tauri/target/release/bundle/**/*.dmg
            apps/shell/src-tauri/target/release/bundle/**/*.msi
            apps/shell/src-tauri/target/release/bundle/**/*.exe

  # 容器镜像:多架构
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (load only; push 需配置 registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: f3-openscience:${{ github.ref_name }}
