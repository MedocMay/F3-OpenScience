name: Release

on:
  push: { tags: ["v*"] }
  workflow_dispatch:

permissions:
  contents: write          # required to create the Release · 创建 Release 需要

jobs:
  # ── Python package: one build, works on every OS ──────────────────
  # Python 包:一次构建,全平台通用(核心零依赖)
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: python-dist, path: dist/* }

  # ── Desktop installers: best-effort ───────────────────────────────
  # 桌面安装包:尽力而为
  #
  # These builds are marked continue-on-error so a desktop failure does not block
  # the Release — the Python package still ships.
  #
  # Intel macOS (macos-13) is deliberately omitted: that runner can queue for
  # hours, and because `release` needs the whole matrix, one stuck runner leaves
  # the Release permanently Queued. This actually happened on the first v0.2.0
  # attempt. Intel users can build locally: cd apps/shell && npm run tauri build
  #
  # 有意不构建 Intel macOS(macos-13):该 runner 可能排队数小时,而 release
  # 依赖整个矩阵,一个卡住的 runner 会让 Release 永远停在 Queued。
  # v0.2.0 第一次发布就是这么卡住的。Intel 用户可本地自行构建。
  #
  # Tauri 壳从未编译过(见 STATUS.md)。这里标记 continue-on-error,
  # 桌面构建失败不会阻塞 Release —— Python 包与源码归档照常发布。
  desktop:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04    # .AppImage / .deb
            deps: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          - os: macos-latest    # .dmg (Apple Silicon)
            deps: ""
          - os: windows-latest  # .msi / .exe
            deps: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45        # a stuck runner must not hold the Release hostage
                               # 卡住的 runner 不得挟持整个 Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        if: matrix.deps != ''
        run: ${{ matrix.deps }}
      - name: Build desktop shell
        working-directory: apps/shell
        run: npm i && npm run tauri build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/shell/src-tauri/target/release/bundle/**/*.AppImage
            apps/shell/src-tauri/target/release/bundle/**/*.deb
            apps/shell/src-tauri/target/release/bundle/**/*.dmg
            apps/shell/src-tauri/target/release/bundle/**/*.msi
            apps/shell/src-tauri/target/release/bundle/**/*.exe

  # ── Publish the Release ───────────────────────────────────────────
  # 发布 Release:收集全部产物并附到 Release 上
  release:
    needs: [backend, desktop]
    if: always() && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## F3-OpenScience ${{ github.ref_name }}

            **敢署名,且不因此变窄 · Sign your name to it — without narrowing what you can reach**

            > ⚠️ **Research prototype · 研究原型**
            > Built under resource constraints and not comprehensively tested.
            > Never run end-to-end with a real LLM; never produced an actual research result.
            > 资源受限下开发,未经全面测试。从未用真实 LLM 端到端跑过,也从未产出过真实研究成果。
            > **Please read [STATUS.md](https://github.com/${{ github.repository }}/blob/main/STATUS.md) before use.**

            ### Install · 安装

            ```bash
            pip install f3-openscience              # core · 核心(零第三方依赖)
            pip install 'f3-openscience[cloud]'     # cloud · 云端
            pip install 'f3-openscience[chem]'      # chemistry · 化学判据
            ```

            Or download the wheel below · 或下载下方的 wheel。

            ### Desktop installers · 桌面安装包

            Linux (`.AppImage` / `.deb`), macOS **Apple Silicon** (`.dmg`), and Windows
            (`.msi` / `.exe`) are attached when their builds succeed.

            **Intel macOS is not prebuilt** — that runner queues for hours and would hold
            the whole release. Build locally: `cd apps/shell && npm run tauri build`

            ⚠️ **Installers are unsigned.** macOS Gatekeeper will refuse to open the `.dmg`
            (right-click → Open, or `xattr -d com.apple.quarantine`); Windows SmartScreen
            will warn. And the GUI itself has never been run by anyone — see STATUS.md.

            Linux、macOS **Apple Silicon**、Windows 的安装包在构建成功时附在下方。

            **Intel macOS 无预编译包** —— 该 runner 排队可能数小时,会拖住整个发布。
            请本地构建:`cd apps/shell && npm run tauri build`

            ⚠️ **安装包未签名。** macOS 会被 Gatekeeper 拦住(右键→打开,或用
            `xattr -d com.apple.quarantine` 解除);Windows 会触发 SmartScreen 警告。
            而且 GUI 本身从未有人真正运行过 —— 见 STATUS.md。

            ### Docs · 文档

            [README](https://github.com/${{ github.repository }}#readme) ·
            [STATUS](https://github.com/${{ github.repository }}/blob/main/STATUS.md) ·
            [INNOVATION](https://github.com/${{ github.repository }}/blob/main/INNOVATION.md) ·
            [REACHABILITY](https://github.com/${{ github.repository }}/blob/main/docs/REACHABILITY.md)
