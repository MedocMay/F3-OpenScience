name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install jsonschema cryptography hatchling build
      - name: Validate contracts (JSON Schema)
        run: |
          python - <<'PY'
          import json, glob
          from jsonschema import Draft202012Validator
          for f in glob.glob("contracts/*.json"):
              Draft202012Validator.check_schema(json.load(open(f)))
              print("ok", f)
          PY
      - name: Regression (suite list · tests/SUITES)
        # Suites that hit live academic APIs (arXiv / CrossRef / OpenAlex) skip
        # themselves when those services are unreachable — CI runners are often
        # rate-limited. Skipping is correct; weakening assertions would hide
        # real regressions. See tests/_netguard.py.
        # 打真实学术 API 的套件在服务不可达时会自行跳过 —— CI 常被限流。
        # 跳过是对的;放宽断言会掩盖真实回归。见 tests/_netguard.py。
        run: |
          fail=0
          # Same list make test uses — see tests/SUITES · 与 make test 同一份清单
          for t in $(sed 's/#.*//' tests/SUITES | tr -d '[:blank:]' | grep .); do
            echo "──────── $t ────────"
            python tests/$t.py || { echo "::error::$t FAILED"; fail=1; }
          done
          exit $fail
      - name: Build wheel
        run: python -m build --wheel
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: TS typecheck (orchestrator)
        working-directory: orchestrator-ts
        run: npm i && npm run typecheck
      - name: Codegen drift check (generated == contracts)
        run: |
          bash scripts/gen-types.sh 2>/dev/null || true
          git diff --exit-code generated 2>/dev/null || (echo "generated/ out of sync — run scripts/gen-types.sh" && exit 1)
